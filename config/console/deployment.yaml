apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-console
  labels:
    app.kubernetes.io/name: agent-console
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"agent-console:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-console
    spec:
      serviceAccountName: agent-console
      affinity:
        # The Claw home PVC is ReadWriteOnce on EBS, so it can only be attached
        # to one node at a time. Multiple pods MAY share it as long as they are
        # on that same node, so the console is pinned to wherever the Claw pod
        # is running. Without this the pod sits Pending on a multi-attach error.
        # Update the instance label with `kustomize edit` or a patch when
        # targeting a Claw other than "podling".
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: claw
                  claw.sandbox.redhat.com/instance: podling
              topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: agent-console:latest
          imagePullPolicy: Always
          env:
            # Agent sessions live at <claw-home>/.openclaw/agents/<agent>/sessions/
            - name: AGENT_DATA_DIR
              value: /data/agents
            - name: LISTEN_ADDR
              value: ":8080"
            # Unset by design: the console then reports gateway health as
            # "disabled" rather than pretending to know. Point it at the Claw
            # service to enable the check.
            # - name: GATEWAY_URL
            #   value: http://podling:8080
            # Optional display metadata, keyed by agent directory name.
            - name: AGENT_META
              value: |
                {"default":{"emoji":"🌱","title":"Podling","desc":"Coordinator — planning, ops, delegation"},
                 "stitch":{"emoji":"🧵","title":"Stitch","desc":"GitHub portfolio maintenance"},
                 "quill":{"emoji":"🪶","title":"Quill","desc":"Meeting → follow-up work"}}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: claw-home
              mountPath: /data/agents
              subPath: .openclaw/agents
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: oauth-proxy
          image: quay.io/openshift/origin-oauth-proxy:4.21
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --openshift-service-account=agent-console
            - --upstream=http://127.0.0.1:8080
            - --http-address=0.0.0.0:4180
            - --https-address=
            - --email-domain=*
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --pass-user-headers=true
            - --skip-auth-regex=^/healthz$
          ports:
            - name: oauth
              containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: cookie-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # runAsUser is deliberately NOT set. OpenClaw writes sessions as mode
        # 0600 inside a 0700 directory — a deliberate, audited restriction —
        # so the console can only read them by running as the SAME UID as the
        # Claw pod, not merely the same group. Both pods omit runAsUser, so
        # restricted-v2 assigns each the first UID of the namespace's
        # openshift.io/sa.scc.uid-range annotation and they match.
        #
        # If the Claw is ever pinned to an explicit runAsUser, pin the console
        # to the same value. Verify with:
        #   oc exec deploy/agent-console -c app -- id
        #   oc exec deploy/<claw> -c gateway -- id
        # A mismatch shows up as a high "unreadable files" count in the
        # console's integrity badge rather than as a crash.
      volumes:
        - name: claw-home
          persistentVolumeClaim:
            claimName: podling-home-pvc
            readOnly: true
        - name: cookie-secret
          secret:
            secretName: agent-console-cookie
